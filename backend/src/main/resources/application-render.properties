# Profil fuer die kostenlose Live-Demo auf Render: eingebaute H2-Datenbank
# statt MySQL, damit kein zusaetzlicher Datenbank-Dienst noetig ist.
# Aktivieren mit: --spring.profiles.active=render
spring.datasource.url=jdbc:h2:mem:bookbuddy;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
logging.level.org.hibernate.SQL=WARN
